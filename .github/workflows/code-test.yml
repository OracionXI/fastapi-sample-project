name: Python Code Tests

on:
  push:
    branches:
      - feature/python-code

permissions:
  contents: read

jobs:
  test-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install Dependencies
        run: |
          pip install --no-cache-dir -r app/requirements.txt
          pip install pytest

      - name: Unit Tests
        run: |
          pytest app/tests/

      - name: Lint Tests
        uses: wearerequired/lint-action@v2
        with:
          flake8: true

      - name: SonarCloud Code Quality Tests
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  Pull-requests:
    runs-on: ubuntu-latest
    needs: test-python

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Pull Request
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          if gh pr list \
            --base development \
            --head feature/python-code --state open | grep -q "feature/python-code"; \
            then echo "PR exists"
          else
            gh pr create \
              --base development \
              --head feature/python-code \
              --title "Auto PR: Merge feature/python-code into development" \
              --body "This pull request was automatically created by GitHub Actions."
            echo "PR created successfully."
          fi
